[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/askarzh/sameroot"
publish = false

# Versions chosen in docs/design/0001-architecture.md §22 (crates.io, 2026-11-10).
# Declared here so every crate uses the same version; a crate only compiles what
# it lists in its own [dependencies].
[workspace.dependencies]
sameroot-core = { path = "crates/sameroot-core" }
sameroot-store = { path = "crates/sameroot-store" }
sameroot-sync = { path = "crates/sameroot-sync" }
sameroot-rpc = { path = "crates/sameroot-rpc" }
sameroot-seal = { path = "crates/sameroot-seal" }

blake3 = "1.8.7"
ed25519-dalek = "3.0.0"
x25519-dalek = "3.0.0"
curve25519-dalek = "5.0.0"
minicbor = "2.3.1"
hpke = "0.15.1"
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
zeroize = "1"
getrandom = "0.3"
thiserror = "2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
redb = "4.5.0"
iroh = { version = "1.4.1", features = ["platform-verifier"] }
iroh-relay = "1.4.1"
# Values by BLAKE3 hash: verified streaming (Bao), resumable, from any holder.
iroh-blobs = { version = "0.104.1", default-features = false, features = ["fs-store"] }
rmcp = "3.9.0"
keyring = "4.2.0"
proptest = "1.12.0"
turmoil = "0.7.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
